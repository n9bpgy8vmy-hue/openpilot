# Page: steering
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: steering
label: Steering
icon: steering_wheel
order: 1
remote_configurable: true
description: Lateral control, lane changes, and steering behavior
sections:
- id: mads
  title: Modular Assistive Driving System (MADS)
  description: ''
  items:
  - key: Mads
    widget: toggle
    title: Enable Modular Assistive Driving System (MADS)
    description: Enable MADS. Disable toggle to revert back to stock sunnypilot engagement/disengagement.
    enablement:
    - $ref: '#/macros/offroad'
  sub_panels:
  - id: mads_settings
    label: MADS Settings
    trigger_key: Mads
    trigger_condition:
      type: param
      key: Mads
      equals: true
    items:
    - key: MadsMainCruiseAllowed
      widget: toggle
      title: Toggle with Main Cruise
      description: 'Note: For vehicles without LFA/LKAS button, disabling this will prevent lateral control engagement.'
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsUnifiedEngagementMode
      widget: toggle
      title: Unified Engagement Mode (UEM)
      description: 'Engage lateral and longitudinal control with cruise control engagement. Note: Once lateral control is
        engaged via UEM, it will remain engaged until it is manually disabled via the MADS button or car shut off.'
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsSteeringMode
      widget: multiple_button
      title: Steering Mode on Brake Pedal
      description: Choose how Automatic Lane Centering (ALC) behaves after the brake pedal is manually pressed in sunnypilot.
      options:
      - value: 0
        label: Remain Active
        enablement:
        - $ref: '#/macros/mads_full_platforms'
      - value: 1
        label: Pause
        enablement:
        - $ref: '#/macros/mads_full_platforms'
      - value: 2
        label: Disengage
      enablement:
      - $ref: '#/macros/offroad'
- id: rivianpilot_lane_position
  title: Rivian Lane Position
  description: Apply a small, bounded lane-position preference on curves or after a deliberate steering nudge. Driver steering always overrides it.
  items:
  - key: RivianPilotLanePositionObserve
    widget: toggle
    title: Observe Lane Position
    description: Calculate and log requested, safety-capped, and applied offsets without changing the model path.
    visibility:
    - type: capability
      field: brand
      equals: rivian
  - key: RivianPilotLanePositionGoLive
    widget: toggle
    title: Go Live
    description: Allow the validated temporary offset to influence the model path. Requires Observe and confident painted lane boundaries.
    visibility:
    - type: capability
      field: brand
      equals: rivian
    enablement:
    - $ref: '#/macros/offroad'
    - type: param
      key: RivianPilotLanePositionObserve
      equals: true
  - key: RivianPilotCurveOffset
    widget: toggle
    title: Curve Offset
    description: Move the preferred path away from the inside edge when predicted lateral acceleration exceeds the threshold.
    visibility:
    - type: capability
      field: brand
      equals: rivian
    enablement:
    - type: param
      key: RivianPilotLanePositionObserve
      equals: true
  - key: RivianPilotFeatureLogging
    widget: toggle
    title: Diagnostic Logging
    description: Record bounded lane-position decisions and safety fallbacks for later analysis.
    visibility:
    - type: capability
      field: brand
      equals: rivian
  - key: RivianPilotVehicleWidthInches
    widget: option
    title: Vehicle Body Width
    description: Body-width envelope used for lane-clearance calculations. Mirrors are excluded.
    min: 78
    max: 86
    step: 1
    unit: inches
    visibility:
    - type: capability
      field: brand
      equals: rivian
    enablement:
    - $ref: '#/macros/offroad'
  - key: RivianPilotBoundaryBufferInches
    widget: option
    title: Boundary Comfort Buffer
    description: Minimum desired body clearance from each confidently detected painted lane boundary.
    min: 3
    max: 12
    step: 1
    unit: inches
    visibility:
    - type: capability
      field: brand
      equals: rivian
    enablement:
    - $ref: '#/macros/offroad'
  - key: RivianPilotCurveOffsetInches
    widget: option
    title: Maximum Curve Offset
    description: Maximum requested curve offset before lane-boundary safety clamping.
    min: 1
    max: 10
    step: 1
    unit: inches
    visibility:
    - type: capability
      field: brand
      equals: rivian
    enablement:
    - type: param
      key: RivianPilotCurveOffset
      equals: true
  - key: RivianPilotCurveThreshold
    widget: option
    title: Curve Activation Threshold
    description: Higher values require a stronger predicted curve before applying an offset.
    min: 10
    max: 90
    step: 5
    unit: percent
    visibility:
    - type: capability
      field: brand
      equals: rivian
    enablement:
    - type: param
      key: RivianPilotCurveOffset
      equals: true
  - key: RivianPilotLanePositionPreference
    widget: multiple_button
    title: Lane Position
    description: Default follows the model path. Center uses trusted lane geometry; Left and Right add the selected bias on straight roads and curves. Curve avoidance remains the higher-priority constraint.
    options:
    - value: 0
      label: Default
    - value: 1
      label: Center
    - value: 2
      label: Left
    - value: 3
      label: Right
    visibility:
    - type: capability
      field: brand
      equals: rivian
    enablement:
    - type: param
      key: RivianPilotLanePositionObserve
      equals: true
  - key: RivianPilotCenterCorrectionInches
    widget: option
    title: Center Correction Limit
    description: Maximum measured model-to-lane-center correction before adding an optional Left or Right bias.
    min: 1
    max: 10
    step: 1
    unit: inches
    visibility:
    - type: capability
      field: brand
      equals: rivian
    enablement:
    - type: not
      condition:
        type: param
        key: RivianPilotLanePositionPreference
        equals: 0
  - key: RivianPilotLanePositionBiasInches
    widget: option
    title: Lane Position Bias
    description: Additional Left or Right preference after center correction. Center plus bias may request up to 15 inches before boundary, fork, ramp, and defensive limits.
    min: 1
    max: 10
    step: 1
    unit: inches
    visibility:
    - type: capability
      field: brand
      equals: rivian
    enablement:
    - type: not
      condition:
        type: param
        key: RivianPilotLanePositionPreference
        equals: 0
  - key: RivianPilotLanePositionRelaxed
    widget: toggle
    title: Allow Poorly Marked Roads
    description: Without stable painted lane lines, permit at most two inches of curve offset. Leave off for strict lane-boundary behavior.
    visibility:
    - type: capability
      field: brand
      equals: rivian
    enablement:
    - $ref: '#/macros/offroad'
    - type: param
      key: RivianPilotCurveOffset
      equals: true
  - key: RivianPilotPoorRoadOffsetInches
    widget: option
    title: Poorly Marked Road Offset Request
    description: Requested maximum from 1 to 10 inches. Without trustworthy boundary clearance, runtime approval remains capped at three inches.
    min: 1
    max: 10
    step: 1
    unit: inches
    visibility:
    - type: capability
      field: brand
      equals: rivian
    enablement:
    - $ref: '#/macros/offroad'
    - type: param
      key: RivianPilotLanePositionRelaxed
      equals: true
  - key: RivianPilotNudgeOffset
    widget: toggle
    title: Nudge Lane Offset
    description: After a deliberate steering nudge, temporarily prefer that side of the current lane.
    visibility:
    - type: capability
      field: brand
      equals: rivian
    enablement:
    - type: param
      key: RivianPilotLanePositionObserve
      equals: true
  - key: RivianPilotNudgeOffsetInches
    widget: option
    title: Nudge Offset Distance
    description: Requested nudge offset before lane-boundary safety clamping.
    min: 2
    max: 10
    step: 1
    unit: inches
    visibility:
    - type: capability
      field: brand
      equals: rivian
    enablement:
    - type: param
      key: RivianPilotNudgeOffset
      equals: true
  - key: RivianPilotNudgeHoldSeconds
    widget: option
    title: Nudge Hold Time
    description: Maximum time to retain a nudge preference when all confidence checks remain valid.
    options:
    - value: 5
      label: 5 seconds
    - value: 10
      label: 10 seconds
    - value: 20
      label: 20 seconds
    - value: 30
      label: 30 seconds
    - value: 60
      label: 1 minute
    - value: 120
      label: 2 minutes
    - value: 300
      label: 5 minutes
    - value: 600
      label: 10 minutes
    - value: 900
      label: 15 minutes
    - value: 1800
      label: 30 minutes
    visibility:
    - type: capability
      field: brand
      equals: rivian
    enablement:
    - type: param
      key: RivianPilotNudgeOffset
      equals: true
- id: blinker
  title: Blinker Control
  description: Lateral pause behavior during turn signals
  items:
  - key: BlinkerPauseLateralControl
    widget: toggle
    title: Pause Lateral Control with Blinker
    description: Pause lateral control with blinker when traveling below the desired speed selected.
    sub_items:
    - key: BlinkerMinLateralControlSpeed
      widget: option
      title: Minimum Speed to Pause Lateral Control
      min: 0
      max: 255
      step: 5
      unit:
        metric: km/h
        imperial: mph
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
    - key: BlinkerLateralReengageDelay
      widget: option
      title: Post-Blinker Delay
      description: Delay before lateral control resumes after the turn signal ends.
      min: 0
      max: 10
      step: 1
      unit: second
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
- id: torque
  title: Torque Control
  description: Steering torque tuning and lateral control method
  enablement:
  - type: capability
    field: torque_allowed
    equals: true
  items:
  - key: EnforceTorqueControl
    widget: toggle
    title: Enforce Torque Lateral Control
    description: Enable this to enforce sunnypilot to steer with Torque lateral control.
    visibility:
    - type: not
      condition:
        type: capability
        field: steer_control_type
        equals: angle
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: torque_allowed
      equals: true
    - type: param
      key: NeuralNetworkLateralControl
      equals: false
  sub_panels:
  - id: torque_settings
    label: Torque Settings
    trigger_key: EnforceTorqueControl
    trigger_condition:
      type: param
      key: EnforceTorqueControl
      equals: true
    items:
    - key: LiveTorqueParamsToggle
      widget: toggle
      title: Self-Tune
      description: Enables self-tune for Torque lateral control for platforms that do not use Torque lateral control by default.
      enablement:
      - $ref: '#/macros/offroad'
    - key: LiveTorqueParamsRelaxedToggle
      widget: toggle
      title: Less Restrict Settings for Self-Tune (Beta)
      description: Less strict settings when using Self-Tune. This allows torqued to be more forgiving when learning values.
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: LiveTorqueParamsToggle
        equals: true
    - key: CustomTorqueParams
      widget: toggle
      title: Enable Custom Tuning
      description: Enables custom tuning for Torque lateral control. Modifying Lateral Acceleration Factor and Friction below
        will override the offline values indicated in the YAML files within "opendbc/car/torque_data". The values will also
        be used live when "Manual Real-Time Tuning" toggle is enabled.
      enablement:
      - $ref: '#/macros/offroad'
    - key: TorqueParamsOverrideEnabled
      widget: toggle
      title: Manual Real-Time Tuning
      description: Enforces the torque lateral controller to use the fixed values instead of the learned values from Self-Tune.
        Enabling this toggle overrides Self-Tune values.
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: CustomTorqueParams
        equals: true
    - key: TorqueParamsOverrideLatAccelFactor
      widget: option
      title: Lateral Acceleration Factor
      title_param_suffix:
        param: TorqueParamsOverrideEnabled
        values:
          'true': (Real-Time & Offline)
          'false': (Offline Only)
      min: 0.1
      max: 5.0
      step: 0.1
      unit: m/s²
      enablement:
      - type: param
        key: CustomTorqueParams
        equals: true
      - type: any
        conditions:
        - type: param
          key: TorqueParamsOverrideEnabled
          equals: true
        - type: offroad_only
    - key: TorqueParamsOverrideFriction
      widget: option
      title: Friction
      title_param_suffix:
        param: TorqueParamsOverrideEnabled
        values:
          'true': (Real-Time & Offline)
          'false': (Offline Only)
      min: 0.0
      max: 1.0
      step: 0.01
      enablement:
      - type: param
        key: CustomTorqueParams
        equals: true
      - type: any
        conditions:
        - type: param
          key: TorqueParamsOverrideEnabled
          equals: true
        - type: offroad_only
    - key: TorqueControlTune
      widget: multiple_button
      title: Torque Control Tune Version
      description: Select the version of Torque Control Tune to use.
      options:
      - value: ''
        label: Default
      - value: 1.0
        label: v1.0
      - value: 0.0
        label: v0.0
      enablement:
      - $ref: '#/macros/offroad'
- id: lane_change
  title: Lane Change
  description: Automatic lane change timing and behavior
  items:
  - key: AutoLaneChangeTimer
    widget: option
    title: Auto Lane Change by Blinker
    description: |-
      Set a timer to delay the auto lane change operation when the blinker is used. No nudge on the steering wheel is required to auto lane change if a timer is set. Default is Nudge.
    details: |-
      Please use caution when using this feature. Only use the blinker when traffic and road conditions permit.
    options:
    - value: -1
      label: 'Off'
    - value: 0
      label: Nudge
    - value: 1
      label: Nudgeless
    - value: 2
      label: 0.5 second
    - value: 3
      label: 1 second
    - value: 4
      label: 2 seconds
    - value: 5
      label: 3 seconds
  - key: AutoLaneChangeBsmDelay
    widget: toggle
    title: 'Auto Lane Change: Delay with Blind Spot'
    description: Toggle to enable a delay timer for lane changes when blind spot monitoring (BSM) detects a vehicle in your blind
      spot.
    enablement:
    - type: capability
      field: enable_bsm
      equals: true
    - type: param_compare
      key: AutoLaneChangeTimer
      op: '>'
      value: 0
