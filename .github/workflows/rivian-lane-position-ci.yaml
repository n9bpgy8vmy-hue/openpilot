name: Rivian lane-position port

on:
  push:
    branches: [rx-laneposition, fix/rx-laneposition-038]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked test environment
        run: uv sync --frozen --extra testing
      - name: Verify required LFS assets are materialized
        run: |
          git lfs install --local
          git config --local lfs.url https://gitlab.com/sunnypilot/public/sunnypilot-new-lfs.git/info/lfs
          git lfs pull
          ! grep -q '^version https://git-lfs.github.com/spec/v1$' openpilot/selfdrive/assets/fonts/Audiowide-Regular.ttf
          ! grep -q '^version https://git-lfs.github.com/spec/v1$' openpilot/selfdrive/assets/fonts/Inter-Regular.ttf
          ! grep -q '^version https://git-lfs.github.com/spec/v1$' openpilot/selfdrive/modeld/models/driving_supercombo.onnx
      - name: Generate native Params and Cereal modules
        run: |
          uv run --frozen --all-extras scons -j2 --minimal \
            openpilot/common/params_pyx.so \
            openpilot/cereal \
            msgq_repo/msgq/ipc_pyx.so \
            msgq_repo/msgq/visionipc/visionipc_pyx.so
      - name: Verify runtime dependencies and imports
        run: |
          uv run --frozen --all-extras python - <<'PY'
          import yaml
          import numpy
          import openpilot.cereal.messaging
          from openpilot.common.params import Params
          from msgq.visionipc import VisionIpcClient
          from openpilot.sunnypilot.rivian_lane_position.lane_position_controller import LanePositionController
          from openpilot.sunnypilot.modeld_v2.camera_offset_helper import CameraOffsetHelper
          print("runtime imports OK", yaml.__version__, numpy.__version__, Params, VisionIpcClient,
                LanePositionController, CameraOffsetHelper)
          PY
      - name: Compile complete device tree
        run: uv run --frozen --all-extras scons -j2 --minimal
      - name: Run focused tests
        run: |
          uv run --frozen --extra testing pytest -q -n 0 \
            --confcutdir=openpilot/sunnypilot \
            openpilot/sunnypilot/rivian_lane_position/tests/test_lane_position_controller.py \
            openpilot/sunnypilot/modeld_v2/tests/test_camera_offset_helper.py \
            openpilot/sunnypilot/sunnylink/tests/test_compile_settings_ui.py \
            openpilot/sunnypilot/sunnylink/tests/test_settings_changes.py
      - name: Lint port and integration points
        run: |
          uv run --frozen --extra testing ruff check \
            openpilot/sunnypilot/rivian_lane_position \
            openpilot/selfdrive/selfdrived/selfdrived.py \
            openpilot/sunnypilot/modeld_v2/modeld.py \
            openpilot/sunnypilot/modeld_v2/camera_offset_helper.py \
            openpilot/sunnypilot/modeld_v2/tests/test_camera_offset_helper.py
